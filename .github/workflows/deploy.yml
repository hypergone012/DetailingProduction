# One-click deploy: Supabase (database, Edge Functions, Auth, Storage, Cron) + Cloudflare Pages.
# Run it from GitHub: Actions → "Deploy" → Run workflow. Step-by-step setup: DEPLOY-IN-BROWSER.md.
# Every step is idempotent: running it again updates the site without touching bookings,
# customers, payments or the secrets generated on the first run.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      pages_project:
        description: 'Имя проекта Cloudflare Pages (адрес сайта: https://<имя>.pages.dev, если имя свободно). Латиница, цифры, дефис.'
        required: true
        default: 'detailing-studio'
      app_url:
        description: 'Свой домен, если уже подключён к проекту Pages (например https://app.example.ru). Пусто — адрес pages.dev.'
        required: false
        default: ''

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TENANT_DEMO_OWNER_PASSWORD: ${{ secrets.DEMO_OWNER_PASSWORD }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      PAGES_PROJECT: ${{ inputs.pages_project }}
      CUSTOM_APP_URL: ${{ inputs.app_url }}
    steps:
      - name: Проверить секреты репозитория
        shell: bash
        run: |
          missing=()
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF DATABASE_URL CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TENANT_DEMO_OWNER_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Не заданы секреты: ${missing[*]} (DATABASE_URL = секрет SUPABASE_DB_URL, TENANT_DEMO_OWNER_PASSWORD = секрет DEMO_OWNER_PASSWORD). Settings → Secrets and variables → Actions. См. DEPLOY-IN-BROWSER.md."
            exit 1
          fi
          if ! [[ "$PAGES_PROJECT" =~ ^[a-z0-9][a-z0-9-]{0,56}[a-z0-9]$ ]]; then
            echo "::error::Имя проекта Pages: строчная латиница, цифры, дефис (сейчас: $PAGES_PROJECT)"; exit 1
          fi
          if [[ "$DATABASE_URL" == *"[YOUR-PASSWORD]"* ]]; then
            echo "::error::В SUPABASE_DB_URL остался шаблон [YOUR-PASSWORD] — подставьте пароль базы."; exit 1
          fi
          if [ ${#TENANT_DEMO_OWNER_PASSWORD} -lt 8 ]; then
            echo "::error::DEMO_OWNER_PASSWORD: не короче 8 символов"; exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Установить зависимости
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      - name: Cloudflare Pages — проект и адрес сайта
        run: pnpm -s deploy:step pages

      - name: Адрес API
        run: echo "SUPABASE_URL=https://$SUPABASE_PROJECT_REF.supabase.co" >> "$GITHUB_ENV"

      - name: Ключи API проекта
        run: pnpm -s deploy:step keys

      - name: База — расширения Cron
        run: pnpm -s deploy:step extensions

      - name: База — миграции
        run: pnpm -s db:migrate

      - name: Секреты, Vault, расписания
        run: pnpm -s deploy:step finalize --out="$RUNNER_TEMP/functions.env"

      - name: Edge Functions
        shell: bash
        run: |
          pnpm -s functions:vendor
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" --env-file "$RUNNER_TEMP/functions.env"
          supabase functions deploy public-api owner-api notify-dispatcher assistant --project-ref "$SUPABASE_PROJECT_REF" --use-api

      - name: Auth — адрес сайта и вход только по приглашению
        run: pnpm -s deploy:step auth

      - name: Студии — публикация
        run: pnpm -s tenant:publish --all

      - name: Сайт — сборка
        shell: bash
        run: |
          VITE_SUPABASE_URL="$SUPABASE_URL" VITE_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" pnpm build
          pnpm tenant:shells
          # Cloudflare Pages: every studio has its own index.html under /s/<slug>/ (served as the
          # directory index); any other path falls back to /index.html (SPA mode). _redirects is
          # not needed there and its rewrite rules would count against the Pages rule limits.
          rm -f apps/web/dist/_redirects
          set -a; . "$RUNNER_TEMP/functions.env"; set +a
          pnpm security:scan-bundle

      - name: Сайт — выкладка в Cloudflare Pages
        shell: bash
        run: |
          pnpm dlx wrangler@4.146.0 pages deploy apps/web/dist --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true

      - name: Проверка опубликованного сайта
        shell: bash
        run: |
          for i in 1 2 3 4 5 6; do
            pnpm -s tenant:verify --all --app-url="$APP_URL" && exit 0
            echo "повтор через 20 с (Pages ещё раздаёт новую версию)"; sleep 20
          done
          exit 1

      - name: Ссылки
        if: success()
        run: pnpm -s deploy:step summary >> "$GITHUB_STEP_SUMMARY"
